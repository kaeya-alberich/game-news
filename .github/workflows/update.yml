name: 更新资讯数据

on:
  schedule:
    # 每 2 小时运行一次 (UTC时间)
    - cron: '0 */2 * * *'
  workflow_dispatch: # 允许你在网页上手动点击运行

permissions:
  contents: write # 允许 Action 提交代码到仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 安装 fetch.py 运行需要的库
          pip install requests beautifulsoup4 feedparser

      - name: 运行抓取脚本
        env:
          # 如果你配置了 AI 摘要，这里会把 Key 传给脚本
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python fetch.py

      - name: 提交并推送更改
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # 检查是否有文件更新，有更新才 commit，防止报错
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 自动更新资讯数据"
          git push
